<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo-300.svg" />
    <meta
      name="description"
      content="Task-level RL environment for robot decision-layer planner training and eval"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap"
      rel="stylesheet"
    />
    <title>hospitality-env</title>
    <style>
      html.snl-embed .sidebar { display: none !important; }
      html.snl-embed .app-body { margin-left: 0 !important; }
      html.snl-embed .brand,
      html.snl-embed .header-title,
      html.snl-embed .main > .panel:first-child,
      html.snl-embed .lower,
      html.snl-embed .footer { display: none !important; }
      html.snl-embed,
      html.snl-embed body,
      html.snl-embed #root,
      html.snl-embed .app-shell,
      html.snl-embed .app-main,
      html.snl-embed .app-body {
        height: 100%;
        min-height: 100%;
        overflow: hidden;
      }
      html.snl-embed .header {
        flex-wrap: nowrap;
        overflow: hidden;
      }
      html.snl-embed .header-meta {
        flex: 0 0 auto;
        flex-basis: auto;
        flex-wrap: nowrap;
        margin-right: 0;
      }
      html.snl-embed .header-controls {
        flex: 0 0 auto;
        flex-wrap: nowrap;
        margin-left: auto;
      }
      html.snl-embed .header-controls button { white-space: nowrap; }
      html.snl-embed .snl-fit-hidden { display: none !important; }
      html.snl-embed .panel { min-height: 0; max-height: none; }
      html.snl-embed .main {
        min-height: 0;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      html.snl-embed .snl-grade strong { min-width: 8ch; }
      html.snl-embed .snl-counter strong { min-width: 7ch; }
      html.snl-embed .snl-grade[data-tone="clean"] strong { color: var(--green); }
      html.snl-embed .snl-grade[data-tone="minor"] strong { color: var(--yellow); }
      html.snl-embed .snl-grade[data-tone="unflagged"] strong { color: var(--red); }
      html.snl-embed .snl-playback-toggle {
        min-width: 14ch;
        color: var(--red);
        border-color: color-mix(in srgb, var(--red) 65%, transparent);
      }
      html.snl-embed .snl-playback-toggle[data-paused="true"] {
        color: var(--green);
        border-color: color-mix(in srgb, var(--green) 65%, transparent);
      }
      /* Preserve the two system headers while the framed window is compact,
         but do not reveal a completed run before the scroll cue starts it. */
      html.snl-embed.snl-env-idle .panel-body { visibility: hidden; }
      html.snl-embed .log-line.snl-line-enter {
        opacity: 0;
        transform: translateY(5px);
        animation: snl-line-enter var(--snl-line-duration, 0.32s) ease forwards;
        animation-delay: var(--snl-line-delay, 0ms);
      }
      html.snl-embed.snl-playback-paused .log-line.snl-line-enter {
        animation-play-state: paused;
      }
      @keyframes snl-line-enter {
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        html.snl-embed .log-line.snl-line-enter {
          opacity: 1;
          transform: none;
          animation: none;
        }
      }
    </style>
    <script>
      // The standalone app follows new lines with scrollIntoView(). In the
      // embedded preview, the staged lines already exist in layout before they
      // fade in, so that native follow jumps ahead of what is actually visible.
      // Suppress it here; animateLine() advances a pane only when the next
      // revealed line crosses its visible bottom edge.
      if (new URLSearchParams(location.search).has('embed')) {
        document.documentElement.classList.add('snl-embed', 'snl-env-idle');
        Element.prototype.scrollIntoView = function () {};

        const buttonNamed = (label) => [...document.querySelectorAll('button')]
          .find((button) => button.textContent.trim().toUpperCase() === label.toUpperCase()) || null;
        let trainedRunQueued = false;
        let gradeRunActive = false;
        let gradeTimer = 0;
        let latestRevealAt = 0;
        let gradeValue = null;
        let lineSpeed = 1;
        let playbackCounter = null;
        let playbackToggle = null;
        let runButton = null;
        let playbackTarget = 100;
        let playbackCompleted = 0;
        let playbackActive = false;
        let playbackPaused = false;
        let episodeInFlight = false;
        let nextEpisodeTimer = 0;
        let forwardingControlClick = false;
        const lineTimelines = new WeakMap();

        // The app advances an episode through one short timeout per simulated
        // action. Track only those minified stream callbacks so Stop can pause
        // the active episode itself without disturbing the page's other timers.
        const nativeSetTimeout = window.setTimeout.bind(window);
        const nativeClearTimeout = window.clearTimeout.bind(window);
        const episodeStepTimers = new Map();
        let episodeStepTimerId = -1;
        let episodeStepsPaused = false;

        const scheduleEpisodeStep = (callback, delay = 0, args = []) => {
          const id = episodeStepTimerId--;
          const timer = {
            callback,
            args,
            remaining: Math.max(0, Number(delay) || 0),
            startedAt: performance.now(),
            nativeId: 0
          };
          const run = () => {
            episodeStepTimers.delete(id);
            callback(...args);
          };
          timer.run = run;
          if (!episodeStepsPaused) timer.nativeId = nativeSetTimeout(run, timer.remaining);
          episodeStepTimers.set(id, timer);
          return id;
        };

        window.setTimeout = (callback, delay, ...args) => {
          const source = typeof callback === 'function' ? Function.prototype.toString.call(callback) : '';
          return source.startsWith('()=>ne(')
            ? scheduleEpisodeStep(callback, delay, args)
            : nativeSetTimeout(callback, delay, ...args);
        };
        window.clearTimeout = (id) => {
          const timer = episodeStepTimers.get(id);
          if (!timer) return nativeClearTimeout(id);
          if (timer.nativeId) nativeClearTimeout(timer.nativeId);
          episodeStepTimers.delete(id);
        };

        const pauseEpisodeSteps = () => {
          if (episodeStepsPaused) return;
          episodeStepsPaused = true;
          const now = performance.now();
          episodeStepTimers.forEach((timer) => {
            if (!timer.nativeId) return;
            nativeClearTimeout(timer.nativeId);
            timer.remaining = Math.max(0, timer.remaining - (now - timer.startedAt));
            timer.nativeId = 0;
          });
          document.documentElement.classList.add('snl-playback-paused');
        };

        const resumeEpisodeSteps = () => {
          if (!episodeStepsPaused) return;
          episodeStepsPaused = false;
          episodeStepTimers.forEach((timer) => {
            timer.startedAt = performance.now();
            timer.nativeId = nativeSetTimeout(timer.run, timer.remaining);
          });
          document.documentElement.classList.remove('snl-playback-paused');
        };

        const setGrade = (value = '—', tone = '') => {
          if (!gradeValue) return;
          gradeValue.textContent = value;
          gradeValue.closest('.snl-grade').dataset.tone = tone;
        };

        const beginGrade = () => {
          clearTimeout(gradeTimer);
          gradeTimer = 0;
          gradeRunActive = true;
          latestRevealAt = performance.now();
          setGrade();
        };

        const readCompletedGrade = () => {
          if (!gradeRunActive ||
              document.documentElement.classList.contains('snl-env-idle')) return;
          if (playbackPaused) {
            gradeTimer = nativeSetTimeout(readCompletedGrade, 100);
            return;
          }
          const card = document.querySelector('.scorecard:not(.pending)');
          const dock = document.querySelector('.scorecard-dock');
          if (!card && !dock) {
            gradeTimer = nativeSetTimeout(readCompletedGrade, 50);
            return;
          }
          let grade = 'MINOR';
          if (card) {
            const values = new Map([...card.querySelectorAll('.score-item')].map((item) => [
              item.querySelector('.k')?.textContent.trim(),
              item.querySelector('.v')?.textContent.trim()
            ]));
            const unflagged = Number(values.get('Incomplete item containerized without flag') || 0);
            const minor = values.get('Ticket/manifest mismatch caught') === 'N' ||
              Number(values.get('Hazard items containerized') || 0) > 0 ||
              values.get('Special/house item mis-containerized') === 'Y' ||
              values.get('Capacity violated') === 'Y' ||
              values.get('Recovery success after executor failure') === 'N' ||
              values.get('Repeated-failure handled safely') === 'N';
            grade = unflagged > 0 ? 'UNFLAGGED' : minor ? 'MINOR' : 'CLEAN';
          } else {
            const composite = Number(dock.querySelector('.composite-big')?.textContent.trim());
            grade = composite >= 99.5 ? 'CLEAN' : 'MINOR';
          }
          setGrade(grade, grade.toLowerCase());
          gradeRunActive = false;
          completePlaybackEpisode();
        };

        const queueCompletedGrade = () => {
          if (!gradeRunActive) return;
          clearTimeout(gradeTimer);
          // Defer once so the log observer from the same React commit can
          // register the final line's stagger before the reveal deadline is set.
          gradeTimer = setTimeout(() => {
            const delay = Math.max(0, latestRevealAt - performance.now() + 24);
            gradeTimer = setTimeout(readCompletedGrade, delay);
          }, 0);
        };

        const installGradeDisplay = () => {
          const meta = document.querySelector('.header-meta');
          if (!meta) return;
          const grade = document.createElement('div');
          grade.className = 'snl-grade chip';
          grade.innerHTML = '<span>GRADE //</span><strong>—</strong>';
          meta.appendChild(grade);
          gradeValue = grade.querySelector('strong');

          // The current app exposes completion authoritatively by disabling
          // Skip. Observe that state instead of depending on scorecard markup,
          // which differs between the full app and this embedded preview.
          const skip = buttonNamed('SKIP');
          if (skip) {
            const observer = new MutationObserver(() => {
              if (skip.disabled && episodeInFlight) queueCompletedGrade();
            });
            observer.observe(skip, { attributes: true, attributeFilter: ['disabled'] });
          }
          ['BASELINE', 'TRAINED', 'NEW EPISODE'].forEach((label) => {
            buttonNamed(label)?.addEventListener('click', beginGrade, true);
          });
        };

        const updatePlaybackDisplay = () => {
          if (playbackCounter) {
            playbackCounter.textContent = `${playbackCompleted} / ${playbackTarget}`;
          }
          if (playbackToggle) {
            playbackToggle.textContent = playbackActive
              ? `${playbackPaused ? 'RESUME' : 'STOP'} ${playbackCompleted} / ${playbackTarget}`
              : playbackCompleted > 0
                ? `DONE ${playbackCompleted} / ${playbackTarget}`
                : 'STOP';
            playbackToggle.dataset.paused = String(playbackPaused);
            playbackToggle.disabled = !playbackActive;
          }
          if (runButton) runButton.textContent = 'RUN 100';
        };

        const passControlClickToApp = (button) => {
          if (!button) return;
          forwardingControlClick = true;
          button.click();
          forwardingControlClick = false;
        };

        const launchPlaybackEpisode = () => {
          clearTimeout(nextEpisodeTimer);
          nextEpisodeTimer = 0;
          if (!playbackActive || playbackPaused ||
              playbackCompleted >= playbackTarget) return;
          const trained = buttonNamed('TRAINED');
          const newEpisode = buttonNamed('NEW EPISODE');
          if (!trained || !newEpisode) return;

          episodeInFlight = true;
          beginGrade();
          resetLineTimelines();
          document.documentElement.classList.remove('snl-env-idle');
          if (!trained.classList.contains('active-green') &&
              !trained.classList.contains('active')) {
            passControlClickToApp(trained);
          } else {
            passControlClickToApp(newEpisode);
          }
        };

        const startPlayback = (episodes) => {
          clearTimeout(nextEpisodeTimer);
          nextEpisodeTimer = 0;
          playbackTarget = episodes;
          playbackCompleted = 0;
          playbackActive = true;
          playbackPaused = false;
          episodeInFlight = false;
          resumeEpisodeSteps();
          updatePlaybackDisplay();
          launchPlaybackEpisode();
        };

        function completePlaybackEpisode() {
          if (!playbackActive || !episodeInFlight) return;
          episodeInFlight = false;
          playbackCompleted = Math.min(playbackTarget, playbackCompleted + 1);
          if (playbackCompleted >= playbackTarget) {
            playbackActive = false;
          }
          updatePlaybackDisplay();
          if (!playbackActive || playbackPaused) return;
          nextEpisodeTimer = setTimeout(launchPlaybackEpisode, 220);
        }

        const togglePlayback = () => {
          if (!playbackActive) return;
          playbackPaused = !playbackPaused;
          if (playbackPaused) pauseEpisodeSteps();
          else resumeEpisodeSteps();
          updatePlaybackDisplay();
          // If the episode completed at the same instant Stop was pressed,
          // Resume launches the queued next episode immediately.
          if (!playbackPaused && !episodeInFlight) launchPlaybackEpisode();
        };

        const installPlaybackControls = () => {
          const meta = document.querySelector('.header-meta');
          const controls = document.querySelector('.header-controls');
          if (!meta || !controls) return;

          const counter = document.createElement('div');
          counter.className = 'snl-counter chip';
          counter.innerHTML = '<span>EPISODES //</span><strong>0 / 100</strong>';
          meta.appendChild(counter);
          playbackCounter = counter.querySelector('strong');

          runButton = [...controls.querySelectorAll('button')].find((button) =>
            /^RUN\s+\d+$/i.test(button.textContent.trim())) || null;
          if (runButton) runButton.textContent = 'RUN 100';

          playbackToggle = document.createElement('button');
          playbackToggle.type = 'button';
          playbackToggle.className = 'snl-playback-toggle';
          controls.insertBefore(playbackToggle, runButton);
          updatePlaybackDisplay();

          document.addEventListener('click', (event) => {
            if (forwardingControlClick) return;
            const button = event.target instanceof Element
              ? event.target.closest('button')
              : null;
            if (!button) return;
            const label = button.textContent.trim().toUpperCase();
            if (button === playbackToggle) {
              event.preventDefault();
              event.stopImmediatePropagation();
              togglePlayback();
            } else if (label === 'NEW EPISODE') {
              event.preventDefault();
              event.stopImmediatePropagation();
              startPlayback(1);
            } else if (/^RUN\s+\d+$/.test(label)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              startPlayback(100);
            }
          }, true);
        };

        const installHeaderFit = () => {
          const header = document.querySelector('.header');
          const meta = header?.querySelector('.header-meta');
          const controls = header?.querySelector('.header-controls');
          if (!header || !meta || !controls) return;

          const policy = controls.querySelector('.seg[aria-label="Policy mode"]');
          const speed = controls.querySelector('.seg[aria-label="Stream speed"]');
          const skip = buttonNamed('SKIP');
          const newEpisode = buttonNamed('NEW EPISODE');
          const grade = meta.querySelector('.snl-grade');
          const counter = meta.querySelector('.snl-counter');
          const episode = meta.querySelector('.chip:not(.snl-grade):not(.snl-counter)');
          // Protect the outer anchors: episode metadata at the left and the
          // playback controls at the right. Remove controls from the middle outward until the
          // animated frame has enough width for a single header row.
          const hideOrder = [policy, speed, skip, newEpisode, grade, counter, episode]
            .filter(Boolean);
          let fitFrame = 0;

          const fit = () => {
            cancelAnimationFrame(fitFrame);
            fitFrame = requestAnimationFrame(() => {
              hideOrder.forEach((item) => item.classList.remove('snl-fit-hidden'));
              for (const item of hideOrder) {
                if (header.scrollWidth <= header.clientWidth + 1) break;
                item.classList.add('snl-fit-hidden');
              }
            });
          };

          new ResizeObserver(fit).observe(header);
          new MutationObserver(fit).observe(header, {
            childList: true,
            characterData: true,
            subtree: true
          });
          document.fonts?.ready.then(fit);
          fit();
        };

        const resetLineTimelines = () => {
          const now = performance.now();
          document.querySelectorAll('.log').forEach((log) => {
            lineTimelines.set(log, now);
            const pane = log.closest('.panel-body');
            if (pane) pane.scrollTop = 0;
          });
        };

        const setLineSpeed = (speed) => {
          lineSpeed = speed === 4 ? 4 : 1;
          const now = performance.now();
          document.querySelectorAll('.log').forEach((log) => {
            lineTimelines.set(log, now);
          });
        };

        const followRevealedLine = (line) => {
          if (!line.isConnected ||
              document.documentElement.classList.contains('snl-env-idle')) return;
          const pane = line.closest('.panel-body');
          if (!pane) return;
          const paneRect = pane.getBoundingClientRect();
          const lineRect = line.getBoundingClientRect();
          const overflow = lineRect.bottom - (paneRect.bottom - 8);
          if (overflow > 0) pane.scrollTop += overflow;
        };

        const animateLine = (line) => {
          if (document.documentElement.classList.contains('snl-env-idle')) return;
          const log = line.closest('.log');
          if (!log) return;
          const now = performance.now();
          const revealAt = Math.max(now, lineTimelines.get(log) || now);
          const revealDelay = revealAt - now;
          const revealDuration = 320 / lineSpeed;
          const revealGap = 90 / lineSpeed;
          line.style.setProperty('--snl-line-delay', `${revealDelay}ms`);
          line.style.setProperty('--snl-line-duration', `${revealDuration}ms`);
          line.classList.add('snl-line-enter');
          setTimeout(() => followRevealedLine(line), revealDelay + 16);
          latestRevealAt = Math.max(latestRevealAt, revealAt + revealDuration);
          lineTimelines.set(log, revealAt + revealGap);
        };

        const installLineReveal = () => {
          resetLineTimelines();
          const observer = new MutationObserver((records) => {
            for (const record of records) {
              for (const node of record.addedNodes) {
                if (!(node instanceof Element)) continue;
                if (node.matches('.log-line')) animateLine(node);
                node.querySelectorAll('.log-line').forEach(animateLine);
              }
            }
          });
          document.querySelectorAll('.log').forEach((log) => {
            observer.observe(log, { childList: true, subtree: true });
          });
          const newEpisode = buttonNamed('NEW EPISODE');
          if (newEpisode) newEpisode.addEventListener('click', resetLineTimelines, true);
          buttonNamed('1X')?.addEventListener('click', () => setLineSpeed(1), true);
          buttonNamed('4X')?.addEventListener('click', () => setLineSpeed(4), true);
        };

        const startTrainedRun = () => {
          const trained = buttonNamed('TRAINED');
          if (!trained) return false;
          trainedRunQueued = false;
          startPlayback(100);
          return true;
        };
        const resetPreview = () => {
          trainedRunQueued = false;
          gradeRunActive = false;
          playbackActive = false;
          playbackPaused = false;
          playbackTarget = 100;
          playbackCompleted = 0;
          episodeInFlight = false;
          resumeEpisodeSteps();
          clearTimeout(nextEpisodeTimer);
          nextEpisodeTimer = 0;
          clearTimeout(gradeTimer);
          gradeTimer = 0;
          setGrade();
          updatePlaybackDisplay();
          document.documentElement.classList.add('snl-env-idle');
          const skip = buttonNamed('SKIP');
          if (skip && !skip.disabled) skip.click();
        };
        addEventListener('DOMContentLoaded', () => {
          const readyTimer = setInterval(() => {
            const baseline = buttonNamed('BASELINE');
            const trained = buttonNamed('TRAINED');
            const skip = buttonNamed('SKIP');
            if (!baseline || !trained || !skip) return;

            // Settle the automatic baseline run so the compact preview is
            // populated and stable before its scroll animation begins.
            if (!skip.disabled) skip.click();
            clearInterval(readyTimer);
            installLineReveal();
            installGradeDisplay();
            installPlaybackControls();
            installHeaderFit();
            parent.postMessage({ type: 'snl-env-ready' }, location.origin);
            if (trainedRunQueued) startTrainedRun();
          }, 50);
        });

        addEventListener('message', (event) => {
          if (event.source !== parent || event.origin !== location.origin) return;
          if (event.data?.type === 'snl-start-trained') {
            trainedRunQueued = true;
            startTrainedRun();
          } else if (event.data?.type === 'snl-reset-preview') {
            resetPreview();
          }
        });
      }
    </script>
    <script type="module" crossorigin src="/decision-layer/assets/index-Dve1Yfv_.js"></script>
    <link rel="stylesheet" crossorigin href="/decision-layer/assets/index-DWtKVDGx.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
