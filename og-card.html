<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    position: relative;
    color: #f2f0eb;
  }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 900px 560px at 78% 30%, rgba(58, 74, 92, 0.30), transparent 65%);
  }
  .frame {
    position: absolute; inset: 26px;
    border: 1px solid rgba(255, 255, 255, 0.16);
  }
  .tick { position: absolute; width: 13px; height: 13px; border: 1px solid rgba(255,255,255,0.38); }
  .tick.tl { top: -7px; left: -7px; border-right: none; border-bottom: none; }
  .tick.tr { top: -7px; right: -7px; border-left: none; border-bottom: none; }
  .tick.bl { bottom: -7px; left: -7px; border-right: none; border-top: none; }
  .tick.br { bottom: -7px; right: -7px; border-left: none; border-top: none; }
  .content {
    position: absolute; left: 96px; top: 50%; transform: translateY(-50%);
    max-width: 760px;
  }
  .mark { display: block; margin-bottom: 44px; }
  h1 {
    font-size: 66px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.05;
    margin-bottom: 26px;
  }
  p {
    font-size: 31px; font-weight: 400; color: #9b9890; line-height: 1.4;
    max-width: 640px;
  }
  .bin {
    position: absolute; right: 52px; bottom: 48px;
    font-family: "Consolas", "Menlo", monospace;
    font-size: 17px; letter-spacing: 0.14em; color: #5c5a54;
  }
  .ringart {
    position: absolute; right: -170px; top: 50%; transform: translateY(-50%);
    opacity: 0.14;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <svg class="ringart" width="640" height="640" viewBox="0 0 32 32">
    <circle cx="20.51" cy="20.51" r="2.66" fill="#3aa189"/>
    <circle cx="16" cy="16" r="8.5" fill="none" stroke="#f2f0eb" stroke-width="0.5"/>
    <circle cx="17.94" cy="17.94" r="5.76" fill="none" stroke="#f2f0eb" stroke-width="0.5"/>
    <circle cx="19.51" cy="19.51" r="3.54" fill="none" stroke="#f2f0eb" stroke-width="0.5"/>
  </svg>
  <div class="frame">
    <div class="tick tl"></div><div class="tick tr"></div>
    <div class="tick bl"></div><div class="tick br"></div>
  </div>
  <div class="content">
    <svg class="mark" width="104" height="104" viewBox="0 0 32 32">
      <circle cx="20.51" cy="20.51" r="2.66" fill="#3aa189"/>
      <circle cx="16" cy="16" r="8.5" fill="none" stroke="#f2f0eb" stroke-width="1.9"/>
      <circle cx="17.94" cy="17.94" r="5.76" fill="none" stroke="#f2f0eb" stroke-width="1.9"/>
      <circle cx="19.51" cy="19.51" r="3.54" fill="none" stroke="#f2f0eb" stroke-width="1.9"/>
    </svg>
    <h1>Second Nature Labs</h1>
    <p>Physics-grounded environments and evals for AI that touches the real world.</p>
  </div>
  <div class="bin">snlabs.dev</div>
</body>
</html>
